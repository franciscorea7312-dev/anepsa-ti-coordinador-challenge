Set-Content -Path ".github\workflows\deploy.yml" -Value 'name: CI/CD Pipeline ANEPSA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]

jobs:
  test_and_build:
    name: Pruebas y Compilacion
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"

      - name: Instalacion limpia de dependencias
        run: npm ci

      - name: Ejecutar Pruebas Unitarias
        run: npm test

      - name: Compilar Proyecto
        run: npm run build

  deploy:
    name: Despliegue a Produccion
    needs: test_and_build
    if: github.ref == '\''refs/heads/main'\'' && github.event_name == '\''push'\''
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v3

      - name: Dar permisos de ejecucion al script
        run: chmod +x scripts/deploy.sh

      - name: Desplegar mediante Script
        run: bash scripts/deploy.sh
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}

      - name: Notificar Exito en Slack
        if: success()
        run: |
          curl -X POST -H '\''Content-Type: application/json'\'' \
          --data '\''{"text":"✅ Despliegue exitoso en Producción para ANEPSA."}'\'' \
          "${{ secrets.SLACK_WEBHOOK_URL }}" || true

      - name: Notificar Fallo en Slack
        if: failure()
        run: |
          curl -X POST -H '\''Content-Type: application/json'\'' \
          --data '\''{"text":"❌ ERROR: El despliegue a Producción ha fallado."}'\'' \
          "${{ secrets.SLACK_WEBHOOK_URL }}" || true' -Encoding UTF8