name: CI/CD Pipeline ANEPSA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]

jobs:
  test_and_build:
    name: Pruebas y Compilación
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Instalación limpia de dependencias
        run: npm ci

      - name: Ejecutar Pruebas Unitarias
        run: npm test

      - name: Compilar Proyecto
        run: npm run build

  deploy:
    name: Despliegue a Producción
    needs: test_and_build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v3

      - name: Dar permisos de ejecución al script
        run: chmod +x scripts/deploy.sh

      - name: Desplegar mediante Script
        run: bash scripts/deploy.sh
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}

      - name: Notificar Éxito en Slack
        if: success() && secrets.SLACK_WEBHOOK_URL != ''
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"✅ Despliegue exitoso en Producción para ANEPSA (CTI-EVAL-2026)."}' \
          ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notificar Fallo en Slack
        if: failure() && secrets.SLACK_WEBHOOK_URL != ''
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"❌ ERROR: El despliegue a Producción ha fallado."}' \
          ${{ secrets.SLACK_WEBHOOK_URL }}